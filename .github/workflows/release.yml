name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    permissions:
      contents: write
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Intel 与 Apple Silicon 分别构建，updater 会按 arch 分发
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - name: Require version tag source
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          echo "Release workflow must run from an existing version tag." >&2
          exit 1

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Check release configuration
        run: npm run release:check -- --mode=release

      - name: Record reproducible release source
        run: npm run release:provenance

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 更新签名：私钥内容（或路径），公钥需填入 tauri.conf.json 的 plugins.updater.pubkey
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS 签名与公证：全部留空时产出未签名构建，功能不受影响
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: 'v__VERSION__'
          releaseBody: '更新内容见 CHANGELOG。'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          # 让 Windows 优先分发 NSIS 安装包（.exe）而不是 MSI
          updaterJsonPreferNsis: true

      - name: Stage portable Windows EXE
        if: matrix.platform == 'windows-latest'
        id: portable
        shell: pwsh
        run: node scripts/stage-windows-portable.mjs

      - name: Upload and verify portable Windows EXE
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.portable.outputs.tag }}" `
            "${{ steps.portable.outputs.portable_path }}" `
            "${{ steps.portable.outputs.checksum_path }}" `
            --clobber
          $release = gh release view "${{ steps.portable.outputs.tag }}" --json assets | ConvertFrom-Json
          $portableName = "${{ steps.portable.outputs.portable_name }}"
          $checksumName = "${{ steps.portable.outputs.checksum_name }}"
          $portableAsset = $release.assets | Where-Object name -eq $portableName | Select-Object -First 1
          if (-not $portableAsset) {
            throw "GitHub Release is missing required portable asset: $portableName"
          }
          $expectedDigest = "sha256:${{ steps.portable.outputs.sha256 }}"
          if ($portableAsset.digest -ne $expectedDigest) {
            throw "Portable asset digest mismatch: expected $expectedDigest, got $($portableAsset.digest)"
          }
          if ($release.assets.name -notcontains $checksumName) {
            throw "GitHub Release is missing required checksum asset: $checksumName"
          }
          $checksumDirectory = Join-Path $env:RUNNER_TEMP 'meow-portable-verification'
          New-Item -ItemType Directory -Path $checksumDirectory -Force | Out-Null
          gh release download "${{ steps.portable.outputs.tag }}" `
            --pattern $checksumName `
            --dir $checksumDirectory `
            --clobber
          $uploadedChecksum = (Get-Content -Raw (Join-Path $checksumDirectory $checksumName)).Trim()
          $expectedChecksum = "${{ steps.portable.outputs.sha256 }}  $portableName"
          if ($uploadedChecksum -ne $expectedChecksum) {
            throw "Portable checksum asset content does not match the staged executable"
          }
