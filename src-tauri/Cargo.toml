[package]
name = "meow-starter"
version = "0.1.0"
description = "Tauri 2 + Vue 3 desktop app template with SQLite, tray, updater, CI and optional AI agent"
authors = ["Shiaoming123"]
license = "MIT"
repository = "https://github.com/Shiaoming123/meow-starter"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "meow_starter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: 系统托盘; image-png: 让 default_window_icon() 能解码 PNG 图标
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Agent 能力（可选，默认全关 —— 不引入任何额外编译与体积负担）
#   agent         = LLM 请求代理 + OS 钥匙串，避免密钥出现在前端（P2 阶段）
#   agent-sidecar = 上述 + Pi RPC 子进程生命周期管理（P3 阶段）
# 详见 docs/agent-integration.md
[features]
default = []
agent = []
agent-sidecar = ["agent"]

# 单实例是桌面端专有能力，移动端目标不参与编译
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

