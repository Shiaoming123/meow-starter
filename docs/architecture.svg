    <rect x="628" y="134" width="96" height="22" rx="5" fill="#21262d" stroke="#30363d"/><text x="642" y="149">clipboard…</text>
  </g>

  <path d="M390 164 L390 186" stroke="#6e7681" stroke-width="2" marker-end="url(#a)"/>

  <rect x="40" y="188" width="700" height="56" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="60" y="212" fill="#d2a8ff" font-size="14" font-weight="600">桥接层 · Bridge（类型安全 IPC）</text>
  <text x="60" y="232" fill="#8b949e" font-size="11">@tauri-apps/api  ·  invoke() / listen()  ·  Agent 密钥经 Rust 代理（get_api_key）</text>

  <path d="M390 244 L390 266" stroke="#6e7681" stroke-width="2" marker-end="url(#a)"/>

