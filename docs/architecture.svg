  <text x="60" y="312" fill="#8b949e" font-size="11">核心插件始终启用 + P1/P2 插件由 Cargo feature 门控</text>
  <g font-size="11" fill="#e6edf3">
    <rect x="60" y="322" width="70" height="24" rx="5" fill="#21262d" stroke="#30363d"/><text x="86" y="338">sql</text>
    <rect x="138" y="322" width="78" height="24" rx="5" fill="#21262d" stroke="#30363d"/><text x="156" y="338">updater</text>
    <rect x="224" y="322" width="70" height="24" rx="5" fill="#21262d" stroke="#30363d"/><text x="250" y="338">tray</text>
