  <text x="60" y="102" fill="#58a6ff" font-size="14" font-weight="600">前端层 · Frontend（Vue 3 + TS + Vite）</text>
  <text x="60" y="124" fill="#8b949e" font-size="11">core 设计系统 · 组件库 · 主题 · Agent UI（ChatPanel）</text>
