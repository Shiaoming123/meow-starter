<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" font-family="-apple-system, system-ui, 'Segoe UI', 'PingFang SC', sans-serif">
  <rect width="780" height="520" fill="#0d1117" rx="12"/>
