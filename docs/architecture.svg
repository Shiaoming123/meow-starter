  <text x="60" y="372" fill="#8b949e" font-size="11">运行于系统 WebView · SQLite(app.db) · 托盘常驻 · 密钥存 OS 钥匙串 · 更新自 GitHub Releases</text>
  <text x="60" y="390" fill="#8b949e" font-size="11">feature 门控：shortcut / clipboard / notification / autostart / agent（keyring+reqwest）/ agent-sidecar</text>

